name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: May-Jo
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          config: |
            {
              "head": {
                "color": "#00f5ff",
                "color_ghost": "#7c3aed"
              },
              "body": {
                "color": "#06b6d4",
                "color_ghost": "#a855f7"
              },
              "tail": {
                "color": "#0891b2",
                "color_ghost": "#8b5cf6"
              },
              "food": {
                "color": "#22d3ee"
              },
              "animation": {
                "duration": 2.5,
                "easing": "ease-in-out"
              }
            }

      - name: Create output directory
        run: mkdir -p output

      - name: Copy generated SVG
        run: cp dist/github-contribution-grid-snake.svg output/github-contribution-grid-snake.svg

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🐍 Update snake animation"
          branch: main
          file_pattern: output/github-contribution-grid-snake.svg
          commit_options: '--no-verify'