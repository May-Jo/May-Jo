<svg xmlns="http://www.w3.org/2000/svg" width="420" height="135" viewBox="0 0 420 135" role="img" aria-label="LeetCode profile card">
  <rect width="100%" height="100%" fill="#0d1117" rx="10"/>
  <g class="card-group">
    <rect x="5" y="5" width="410" height="125" rx="10" class="card-bg"/>
    <image href="data:image/svg+xml;base64," x="188" y="16" width="44" height="44"/>
    <text x="210" y="84" class="platform" text-anchor="middle">LeetCode</text>
    <text x="210" y="108" class="extra" text-anchor="middle">Algorithms &amp; Problem Solving</text>
    <text x="398" y="26" class="arrow" text-anchor="middle">↗</text>
  </g>
  <style>
    .card-bg  { fill: #0d1117; stroke: #21262d; stroke-width: 1.5; transition: all 0.2s ease; }
    .platform { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #3fb950; font-weight: 700; }
    .extra    { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8b949e; }
    .arrow     { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; transition: fill 0.2s ease; }
    svg:hover .card-bg { stroke: #3fb950; fill: #161b22; }
    svg:hover .arrow   { fill: #3fb950; }
  </style>
</svg>