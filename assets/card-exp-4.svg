<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="IoT &amp; TinyML Telemetry experience card">
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>
  <g class="card-group">
    <rect x="18" y="10" width="864" height="180" rx="10" class="card-bg"/>
    <g transform="translate(18, 10)">
      <circle cx="44" cy="32" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="66" y="37" class="role-title">Embedded Systems Developer @ IoT &amp; TinyML Telemetry</text><text x="712" y="37" class="duration" text-anchor="end">2025 – Present</text><text x="832" y="37" class="arrow" text-anchor="end">View ↗</text><text x="66" y="58" class="bullet">• Designed low-power IoT sensor telemetry processing pipelines with on-device TinyML</text><text x="66" y="78" class="bullet">  edge inference</text><text x="66" y="102" class="bullet">• Developed real-time occupancy detection algorithms &amp; automated telemetry streaming</text><text x="66" y="126" class="bullet">• Built responsive web dashboard for monitoring live sensor analytics</text><text x="66" y="156" class="tech-tag">JavaScript  ·  TinyML  ·  IoT Sensors  ·  Embedded Systems</text>
    </g>
  </g>
  <style>
    .card-bg   { fill: #010409; stroke: #21262d; stroke-width: 1.5; transition: all 0.2s ease; }
    .role-title { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #e6edf3; font-weight: 700; }
    .duration   { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #3fb950; }
    .arrow      { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #7d8590; transition: fill 0.2s ease; }
    .bullet     { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
    .tech-tag   { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #3fb950; opacity: 0.85; }
    svg:hover .card-bg { stroke: #3fb950; fill: #0d1117; }
    svg:hover .arrow   { fill: #3fb950; }
  </style>
</svg>