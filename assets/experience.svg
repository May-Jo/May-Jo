ant System<animate attributeName="opacity" begin="0.45s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="301" class="duration" text-anchor="end" opacity="0">2025 – Present<animate attributeName="opacity" begin="0.45s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="74" y="322" class="bullet" opacity="0">• Built intelligent full-stack email automation engine with LLM context parsing &amp;<animate attributeName="opacity" begin="0.55s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="342" class="bullet" opacity="0">  response generation<animate attributeName="opacity" begin="0.55s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="362" class="bullet" opacity="0">• Designed asynchronous task processing, REST APIs &amp; OAuth2 authentication<animate attributeName="opacity" begin="0.60s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="382" class="bullet" opacity="0">  integrations<animate attributeName="opacity" begin="0.60s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="402" class="bullet" opacity="0">• Created reactive web client with real-time notification streams &amp; automated<animate attributeName="opacity" begin="0.65s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="422" class="bullet" opacity="0">  message workflows<animate attributeName="opacity" begin="0.65s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="448" class="tech-tag" opacity="0">TypeScript  ·  Node.js  ·  AI Automation  ·  REST APIs  ·  OAuth<animate attributeName="opacity" begin="0.70s" dur="0.12s" from="0" to="1" fill="freeze"/></text><circle cx="52" cy="502" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="74" y="507" class="role-title" opacity="0">Core Algorithm Specialist @ Algorithmic Solutions Suite<animate attributeName="opacity" begin="0.70s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="507" class="duration" text-ancho