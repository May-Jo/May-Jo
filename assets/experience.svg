  <circle cx="52" cy="90" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="74" y="95" class="role-title" opacity="0">Lead Systems &amp; Algorithm Developer @ Dynamic Patrol Route Optimizer<animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="95" class="duration" text-anchor="end" opacity="0">2025 – Present<animate attributeName="opacity" begin="0.20s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="74" y="116" class="bullet" opacity="0">• Engineered real-time adaptive patrol route optimization using graph algorithms &amp;<animate attributeName="opacity" begin="0.30s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="136" class="bullet" opacity="0">  spatial indexing<animate attributeName="opacity" begin="0.30s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="156" class="bullet" opacity="0">• Implemented Dijkstra's algorithm with selective route re-optimization for dynamic<animate attributeName="opacity" begin="0.35s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="176" class="bullet" opacity="0">  event response<animate attributeName="opacity" begin="0.35s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="196" class="bullet" opacity="0">• Optimized memory footprint and path computation latency in high-density node<animate attributeName="opacity" begin="0.40s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="216" class="bullet" opacity="0">  clusters<animate attributeName="opacity" begin="0.40s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="242" class="tech-tag" opacity="0">C  ·  Graph Algorithms  ·  Dijkstra  ·  Spatial Indexing<animate attributeName="opacity" begin="0.45s" dur="0.12s" from="0" to="1" fill="freeze"/></text><circle cx="52" cy="296" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="74" y="301" class="role-title" opacity="0">TinyML &amp; Embedded Developer @ IoT &amp; Edge AI Systems<animate attributeName="opacity" begin="0.45s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="301" class="duration" text-anchor="end" opacity="0">2025 – Present<animate attributeName="opacity" begin="0.45s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="74" y="322" class="bullet" opacity="0">• Designed smart parking infrastructure integrating low-power IoT sensors with<animate attributeName="opacity" begin="0.55s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="342" class="bullet" opacity="0">  TinyML edge inference<animate attributeName="opacity" begin="0.55s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="362" class="bullet" opacity="0">• Developed real-time telemetry processing pipelines for automated occupancy<animate attributeName="opacity" begin="0.60s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="382" class="bullet" opacity="0">  detection<animate attributeName="opacity" begin="0.60s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="402" class="bullet" opacity="0">• Built responsive web dashboards for monitoring live sensor telemetry and analytics<animate attributeName="opacity" begin="0.65s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="428" class="tech-tag" opacity="0">JavaScript  ·  TinyML  ·  IoT  ·  HTML5/CSS3<animate attributeName="opacity" begin="0.70s" dur="0.12s" from="0" to="1" fill="freeze"/></text><circle cx="52" cy="482" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="74" y="487" class="role-title" opacity="0">Open Source Maintainer &amp; Creator @ Awesome Hackathon<animate attributeName="opacity" begin="0.70s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="836" y="487" class="duration" text-anchor="end" opacity="0">2025 – Present<animate attributeName="opacity" begin="0.70s" dur="0.15s" from="0" to="1" fill="freeze"/></text><text x="74" y="508" class="bullet" opacity="0">• Curated comprehensive ecosystem of tools, APIs, platforms, and playbooks for<animate attributeName="opacity" begin="0.80s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="528" class="bullet" opacity="0">  hackathon builders<animate attributeName="opacity" begin="0.80s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="548" class="bullet" opacity="0">• Created interactive search &amp; filtering web application for rapid tool discovery<animate attributeName="opacity" begin="0.85s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="574" class="tech-tag" opacity="0">Open Source  ·  JavaScript  ·  Web Development<animate attributeName="opacity" begin="0.90s" dur="0.12s" from="0" to="1" fill="freeze"/></text>
