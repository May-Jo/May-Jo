rom="0" to="1" fill="freeze"/></text><text x="74" y="734" class="bullet" opacity="0">• Developed real-time occupancy detection algorithms &amp; automated telemetry streaming<animate attributeName="opacity" begin="1.10s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="754" class="bullet" opacity="0">• Built responsive web dashboard for monitoring live sensor analytics<animate attributeName="opacity" begin="1.15s" dur="0.12s" from="0" to="1" fill="freeze"/></text><text x="74" y="780" class="tech-tag" opacity="0">JavaScript  ·  TinyML  ·  IoT Sensors  ·  Embedded Systems<animate attributeName="opacity" begin="1.20s" dur="0.12s" from="0" to="1" fill="freeze"/></text>
