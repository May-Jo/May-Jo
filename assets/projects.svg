  <g transform="translate(32,76)" opacity="0"><animate attributeName="opacity" begin="0.20s" dur="0.2s" from="0" to="1" fill="freeze"/><rect width="836" height="344" rx="10" fill="#0d1117" stroke="#21262d"/><text x="32" y="34" class="title">Dynamic Patrol Route Optimizer</text><line x1="32" y1="50" x2="804" y2="50" stroke="#21262d" stroke-width="1"/><text x="32" y="74" class="desc">Dynamic, event-aware, and real-time adaptive patrol route optimization system using graph</text><text x="32" y="96" class="desc">algorithms, Dijkstra's algorithm, spatial indexing, and selective route re-optimization</text><text x="32" y="118" class="desc">for security and resource routing.</text><text x="32" y="152" class="section-hdr">Key Metrics:</text><text x="46" y="174" class="metric">▸ Real-time event-driven path re-optimization</text><text x="46" y="194" class="metric">▸ Optimized Dijkstra with spatial node indexing</text><text x="46" y="214" class="metric">▸ Sub-second recalculation in high-density graphs</text><text x="32" y="246" class="stack">Tech Stack: C · Graph Theory · Dijkstra · Spatial Indexing</text><a href="https://github.com/May-Jo/Dynamic-Patrol-Route-Optimizer"><rect x="32" y="284" width="115" height="32" rx="6" fill="#21262d" stroke="#30363d"/><text x="52" y="305" class="btn">GitHub ↗</text></a></g><g transform="translate(32,448)" opacity="0"><animate attributeName="opacity" begin="0.45s" dur="0.2s" from="0" to="1" fill="freeze"/><rect width="836" height="344" rx="10" fill="#0d1117" stroke="#21262d"/><text x="32" y="34" class="title">Parking IoT / TinyML</text><line x1="32" y1="50" x2="804" y2="50" stroke="#21262d" stroke-width="1"/><text x="32" y="74" class="desc">Smart parking system combining IoT hardware sensors with on-device TinyML machine learning</text><text x="32" y="96" class="desc">models for real-time edge inference, automated occupancy detection, and live telemetry</text><text x="32" y="118" class="desc">dashboards.</text><text x="32" y="152" class="section-hdr">Key Metrics:</text><text x="46" y="174" class="metric">▸ Edge inference with TinyML sensor integration</text><text x="46" y="194" class="metric">▸ Real-time slot availability tracking &amp; telemetry</text><text x="46" y="214" class="metric">▸ Low-power embedded architecture &amp; web UI</text><text x="32" y="246" class="stack">Tech Stack: JavaScript · HTML5 · TinyML · IoT · Edge Computing</text><a href="https://github.com/May-Jo/Parking_Iot"><rect x="32" y="284" width="115" height="32" rx="6" fill="#21262d" stroke="#30363d"/><text x="52" y="305" class="btn">GitHub ↗</text></a></g><g transform="translate(32,820)" opacity="0"><animate attributeName="opacity" begin="0.70s" dur="0.2s" from="0" to="1" fill="freeze"/><rect width="836" height="322" rx="10" fill="#0d1117" stroke="#21262d"/><text x="32" y="34" class="title">Awesome Hackathon</text><line x1="32" y1="50" x2="804" y2="50" stroke="#21262d" stroke-width="1"/><text x="32" y="74" class="desc">Open-source curated directory and interactive web application collecting top platforms,</text><text x="32" y="96" class="desc">tools, APIs, guides, and playbooks for hackathon organizers and competitive developers.</text><text x="32" y="130" class="section-hdr">Key Metrics:</text><text x="46" y="152" class="metric">▸ 50+ curated hackathon tools &amp; platforms</text><text x="46" y="172" class="metric">▸ Interactive instant search and filtering engine</text><text x="46" y="192" class="metric">▸ Community-driven open source repository</text><text x="32" y="224" class="stack">Tech Stack: JavaScript · CSS3 · HTML5 · Open Source</text><a href="https://github.com/May-Jo/awesome-hackathon"><rect x="32" y="262" width="115" height="32" rx="6" fill="#21262d" stroke="#30363d"/><text x="52" y="283" class="btn">GitHub ↗</text></a></g><g transform="translate(32,1170)" opacity="0"><animate attributeName="opacity" begin="0.95s" dur="0.2s" from="0" to="1" fill="freeze"/><rect width="836" height="322" rx="10" fill="#0d1117" stroke="#21262d"/><text x="32" y="34" class="title">LLM Engineering &amp; Agents</text><line x1="32" y1="50" x2="804" y2="50" stroke="#21262d" stroke-width="1"/><text x="32" y="74" class="desc">Production-grade repository for LLM engineering featuring retrieval-augmented generation</text><text x="32" y="96" class="desc">(RAG), vector embeddings, custom prompt pipelines, and autonomous agent orchestration.</text><text x="32" y="130" class="section-hdr">Key Metrics:</text><text x="46" y="152" class="metric">▸ RAG with vector embeddings &amp; semantic search</text><text x="46" y="172" class="metric">▸ Custom prompt-chain &amp; agent workflows</text><text x="46" y="192" class="metric">▸ Transformer model integration &amp; fine-tuning</text><text x="32" y="224" class="stack">Tech Stack: Python · Jupyter · Transformers · RAG · LangChain</text><a href="https://github.com/May-Jo/llm_engineering"><rect x="32" y="262" width="115" height="32" rx="6" fill="#21262d" stroke="#30363d"/><text x="52" y="283" class="btn">GitHub ↗</text></a></g>
