<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="codeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#11101d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="300" height="200" fill="url(#codeBg)" rx="12"/>
  <rect x="10" y="10" width="280" height="180" fill="none" stroke="url(#codeText)" stroke-width="1" rx="8" opacity="0.3"/>
  
  <!-- Window controls -->
  <circle cx="25" cy="25" r="6" fill="#ff5f57"/>
  <circle cx="45" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="65" cy="25" r="6" fill="#28ca42"/>
  
  <!-- Code lines with typing animation -->
  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="url(#codeText)" filter="url(#glow)">
    <text x="30" y="55" opacity="0.9">const developer = {</text>
    <text x="50" y="78" opacity="0.8">name: "Mayank",</text>
    <text x="50" y="101" opacity="0.8">role: "CSE | AIML Student",</text>
    <text x="50" y="124" opacity="0.8">stack: ["AI/ML", "Backend", "Hackathons"],</text>
    <text x="50" y="147" opacity="0.8">build: () => "🚀",</text>
    <text x="30" y="170" opacity="0.9">};</text>
  </g>
  
  <!-- Blinking cursor -->
  <rect x="170" y="152" width="8" height="16" fill="#00f5ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <g fill="#00f5ff" opacity="0.4">
    <circle cx="250" cy="40" r="2">
      <animate attributeName="cy" values="40;30;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="100" r="1.5">
      <animate attributeName="cy" values="100;90;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="160" r="1">
      <animate attributeName="cy" values="160;150;160" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>