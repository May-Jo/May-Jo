<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-label="Open Source Contributor card">
  <rect width="100%" height="100%" fill="#0d1117" rx="10"/>
  <g class="card-group">
    <rect x="5" y="5" width="410" height="110" rx="10" class="card-bg"/>
    <image href="data:image/svg+xml;base64," x="24" y="38" width="44" height="44"/>
    <text x="82" y="50" class="title">Open Source Contributor</text>
    <text x="82" y="76" class="subtitle">Awesome Hackathon &amp; Open Repositories</text>
    <text x="398" y="26" class="arrow" text-anchor="middle">↗</text>
  </g>
  <style>
    .card-bg  { fill: #0d1117; stroke: #21262d; stroke-width: 1.5; transition: all 0.2s ease; }
    .title     { font-family: 'JetBrains Mono', monospace; font-size: 15px; fill: #3fb950; font-weight: 700; }
    .subtitle  { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #e6edf3; }
    .arrow     { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #7d8590; transition: fill 0.2s ease; }
    svg:hover .card-bg { stroke: #3fb950; fill: #161b22; }
    svg:hover .arrow   { fill: #3fb950; }
  </style>
</svg>