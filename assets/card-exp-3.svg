<svg xmlns="http://www.w3.org/2000/svg" width="900" height="176" viewBox="0 0 900 176" role="img" aria-label="Awesome Hackathon experience card">
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>
  <g class="card-group">
    <rect x="18" y="10" width="864" height="156" rx="10" class="card-bg"/>
    <g transform="translate(18, 10)">
      <circle cx="44" cy="32" r="6" fill="#3fb950" stroke="#010409" stroke-width="2"/><text x="66" y="37" class="role-title">Open Source Maintainer &amp; Creator @ Awesome Hackathon</text><text x="712" y="37" class="duration" text-anchor="end">2025 – Present</text><text x="832" y="37" class="arrow" text-anchor="end">View ↗</text><text x="66" y="58" class="bullet">• Curated comprehensive ecosystem of tools, APIs, platforms, and playbooks for</text><text x="66" y="78" class="bullet">  hackathon builders</text><text x="66" y="102" class="bullet">• Created interactive search &amp; filtering web application for rapid tool discovery</text><text x="66" y="132" class="tech-tag">Open Source  ·  JavaScript  ·  Web Development</text>
    </g>
  </g>
  <style>
    .card-bg   { fill: #010409; stroke: #21262d; stroke-width: 1.5; transition: all 0.2s ease; }
    .role-title { font-family: 'JetBrains Mono', monospace; font-size: 16px; fill: #e6edf3; font-weight: 700; }
    .duration   { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #3fb950; }
    .arrow      { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #7d8590; transition: fill 0.2s ease; }
    .bullet     { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; }
    .tech-tag   { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #3fb950; opacity: 0.85; }
    svg:hover .card-bg { stroke: #3fb950; fill: #0d1117; }
    svg:hover .arrow   { fill: #3fb950; }
  </style>
</svg>