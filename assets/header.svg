<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#11101d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="subTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#textGradient)" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="url(#textGradient)" opacity="0.3"/>
    </pattern>
    <clipPath id="textClip">
      <rect x="0" y="0" width="1200" height="280"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGradient)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Glow orbs -->
  <circle cx="150" cy="80" r="200" fill="url(#glow1)" />
  <circle cx="1050" cy="200" r="220" fill="url(#glow2)" />
  <circle cx="600" cy="140" r="180" fill="url(#glow3)" />

  <!-- Floating geometric shapes -->
  <g opacity="0.15" filter="url(#glow)">
    <polygon points="100,50 120,10 140,50 170,50 155,85 170,120 140,120 120,85 100,120 70,120 55,85 70,50" fill="url(#textGradient)">
      <animateTransform attributeName="transform" type="rotate" from="0 120 65" to="360 120 65" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1050,100 1070,60 1090,100 1120,100 1105,135 1120,170 1090,170 1070,135 1050,170 1030,170 1015,135 1030,100" fill="url(#subTextGradient)">
      <animateTransform attributeName="transform" type="rotate" from="0 1070 135" to="-360 1070 135" dur="25s" repeatCount="indefinite"/>
    </polygon>
    <rect x="300" y="40" width="60" height="60" fill="url(#textGradient)" rx="8">
      <animateTransform attributeName="transform" type="rotate" from="0 330 70" to="360 330 70" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="900" cy="60" rx="40" ry="20" fill="url(#subTextGradient)">
      <animate attributeName="rx" values="40;50;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="20;30;20" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Circuit-like lines -->
  <g stroke="url(#textGradient)" stroke-width="1" opacity="0.2" stroke-linecap="round">
    <path d="M 50,200 Q 200,150 350,200">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 850,80 Q 1000,130 1150,80">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 200,240 Q 400,220 600,240" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" values="0;30" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main text -->
  <g filter="url(#textGlow)">
    <!-- MAYANK -->
    <text x="600" y="115" text-anchor="middle" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="64" font-weight="700" fill="url(#textGradient)" letter-spacing="8">
      MAYANK
      <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- CSE | AIML Student -->
    <text x="600" y="165" text-anchor="middle" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="20" font-weight="500" fill="url(#subTextGradient)" letter-spacing="4">
      CSE  <tspan fill="#00f5ff">|</tspan>  AIML Student
      <animate attributeName="opacity" values="1;0.6;1" dur="2.5s" repeatCount="indefinite"/>
    </text>

    <!-- Tagline -->
    <text x="600" y="210" text-anchor="middle" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" font-weight="400" fill="#8b8b9a" letter-spacing="2">
      AI / ML  •  Software Development  •  Hackathons
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom accent line -->
  <g>
    <line x1="400" y1="240" x2="800" y2="240" stroke="url(#textGradient)" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <animate attributeName="x1" values="400;380;400" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="800;820;800" dur="3s" repeatCount="indefinite"/>
    </line>
    <circle cx="600" cy="240" r="4" fill="url(#textGradient)">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="url(#textGradient)" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 80,40 h 60 v 60" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,120;120,0;0,120" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1120,40 h -60 v 60" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,120;120,0;0,120" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 80,240 h 60 v -60" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,120;120,0;0,120" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M 1120,240 h -60 v -60" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0,120;120,0;0,120" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating particles -->
  <g fill="url(#textGradient)" opacity="0.5">
    <circle cx="150" cy="150" r="2">
      <animate attributeName="cy" values="150;130;150" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;160;150" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="150" r="1.5">
      <animate attributeName="cy" values="150;170;150" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1050;1040;1050" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="80" r="1">
      <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="220" r="2">
      <animate attributeName="cy" values="220;200;220" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="1.5">
      <animate attributeName="cy" values="200;180;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="50" r="1">
      <animate attributeName="cy" values="50;30;50" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>