<svg xmlns="http://www.w3.org/2000/svg" width="900" height="268" viewBox="0 0 900 268" role="img" aria-label="AI Email Assistant &amp; Automation System project card">
  <rect width="100%" height="100%" fill="#0d1117" rx="12"/>
  <g class="card-group">
    <rect x="18" y="10" width="864" height="248" rx="10" class="card-bg"/>
    <g transform="translate(18, 10)">
      <text x="32" y="34" class="title">AI Email Assistant &amp; Automation System</text><text x="832" y="34" class="arrow" text-anchor="end">View Repository ↗</text><line x1="32" y1="50" x2="832" y2="50" stroke="#21262d" stroke-width="1"/><text x="32" y="74" class="desc">Full-stack intelligent email automation platform using TypeScript &amp; Node.js with LLM context</text><text x="32" y="96" class="desc">parsing, smart response generation, asynchronous queue management, and OAuth authentication.</text><text x="32" y="130" class="section-hdr">Key Metrics:</text><text x="46" y="152" class="metric">▸ LLM-powered email context parsing &amp; response generator</text><text x="46" y="172" class="metric">▸ Asynchronous task queues &amp; RESTful API backend</text><text x="46" y="192" class="metric">▸ Reactive TypeScript frontend &amp; OAuth2 authentication</text><text x="32" y="224" class="stack">Tech Stack: TypeScript · Node.js · AI/LLM · REST APIs · OAuth</text>
    </g>
  </g>
  <style>
    .card-bg     { fill: #010409; stroke: #21262d; stroke-width: 1.5; transition: all 0.2s ease; }
    .title       { font-family: 'JetBrains Mono', monospace; font-size: 19px; fill: #3fb950; font-weight: 700; }
    .arrow       { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #7d8590; transition: fill 0.2s ease; }
    .desc        { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #e6edf3; }
    .section-hdr { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #8b949e; font-weight: 700; }
    .metric      { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #8b949e; }
    .stack       { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #3fb950; opacity: 0.85; }
    svg:hover .card-bg { stroke: #3fb950; fill: #0d1117; }
    svg:hover .arrow   { fill: #3fb950; }
  </style>
</svg>